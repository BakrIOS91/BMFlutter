name: bm_flutter
description: "A Flutter toolkit providing annotation-driven preferences code generation, device security utilities, and reusable UI components."
version: 0.2.0
homepage: "https://github.com/BakrIOS91/BMFlutter"

platforms:
  android:
  ios:
  web:
  linux:
  macos:
  windows:

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.1
  provider: ^6.1.0

  # Storage & Persistence
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.2.0

  # Security & Cryptography
  crypto: ^3.0.7

  # Platform Utilities
  jailbreak_root_detection: ^1.2.0+1
  bm_root_jailbreak_sniffer: ^1.1.5

  # Code Generation (required for preferences builder in lib/build.dart)
  meta: '>=1.17.0 <2.0.0'
  source_gen: ^4.3.0
  build: ^4.0.6
  analyzer: '>=8.1.1 <15.0.0'

  # Code Generation (required for the SVG precompile builder in lib/src/svg_vec_builder.dart)
  vector_graphics_compiler: ^1.2.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.11.1
